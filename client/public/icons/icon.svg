<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="diceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="#3B82F6" stroke-width="4" stroke-opacity="0.3" />
  
  <!-- Glowing Dice Emblem -->
  <g transform="translate(106, 106)" filter="url(#glow)">
    <rect x="0" y="0" width="300" height="300" rx="60" fill="url(#diceGrad)" />
    <!-- 4 Ludo Quadrant Dots -->
    <!-- Red Top Left -->
    <circle cx="85" cy="85" r="28" fill="#EF4444" stroke="#FFFFFF" stroke-width="6" />
    <!-- Green Top Right -->
    <circle cx="215" cy="85" r="28" fill="#10B981" stroke="#FFFFFF" stroke-width="6" />
    <!-- Yellow Bottom Right -->
    <circle cx="215" cy="215" r="28" fill="#F59E0B" stroke="#FFFFFF" stroke-width="6" />
    <!-- Blue Bottom Left -->
    <circle cx="85" cy="215" r="28" fill="#3B82F6" stroke="#FFFFFF" stroke-width="6" />
    <!-- Golden Center Star -->
    <polygon points="150,115 160,140 185,140 165,155 172,180 150,165 128,180 135,155 115,140 140,140" fill="#FCD34D" />
  </g>
</svg>
