services:
  # Backend Web Service (Node + Socket.IO)
  - type: web
    name: budo-backend
    env: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: budo-db
          property: connectionString
      - key: CLIENT_URL
        value: https://budo-game.com

  # Frontend Static Site
  - type: staticSite
    name: budo-client
    rootDir: client
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: budo-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: budo-backend
          property: host

databases:
  - name: budo-db
    databaseName: budo
    user: postgres
    plan: free
